<body>
  <div id="fare"></div>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      font-size: 17px;
    }

    #myVideo {
      position: fixed;
      right: 0;

      margin: 0 !important;
      padding: 0 !important;
      border: none;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;


    }

    iframe {
      display: block !important;

  .overlay {
    display: flex;
    align-items: center;
    justify-content: center;

    position: fixed;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    /* background: radial-gradient(circle at top right, #d702024f, #023ed700); */
    transition: opacity .5s;
    -webkit-user-select: none; /* Safari */
  -ms-user-select: none; /* IE 10 and IE 11 */
  user-select: none; /* Standard syntax */
}

.overlay .container {
   display: flex;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    left: 15px;
    position: absolute;
}
    
.overlay .container > .socials {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.overlay .container > .socials > .title {
    writing-mode: vertical-rl;
    margin: 0;

    color: white;
    font-size: .8vw;
    font-family: PoppinsSemibold;
}

.overlay .container > .socials > .line {
    flex-shrink: 0;

    margin: .7vw 0vw;

    height: 5vw;
    width: .05vw;

    background: rgba(255, 255, 255, .2);
}

.overlay .container > .socials > .buttons > a {
    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;

    margin-bottom: .7vw;
   
    width: 2vw;
    height: 2vw;

    background: white;

    box-shadow: 0 0 .3vw 0 rgba(255, 255, 255, .8);
    transition: color 0.15s;
}

.overlay .container > .socials > .buttons > a:hover {
    background: rgba(255, 255, 255, 0.8);
}

.overlay .container > .socials > .buttons > a::after {
    content: "Link!";
    position: absolute;
    left: 120%;
    transform: scale(.7);

    width: max-content;

    margin: 0;
    padding: .3vw .7vw;
    background: rgba(0, 0, 0, .3);

    color: white;
    font-size: .6vw;
    font-family: PoppinsMedium;
    opacity: .0;
    backdrop-filter: blur(.5vw);

    pointer-events: none;
    user-select: none;
    z-index: 99999;
    transition: all .15s;
}

.overlay .container > .socials > .buttons > a.copied::after {
    transform: scale(1.0);
    opacity: 1.0;
}

.overlay .container > .socials > .buttons > a > img {
    width: 1vw;
}

@font-face {
    font-family: "PoppinsSemibold";
    src: url(./fonts/Poppins-SemiBold.ttf);
    /* src: url(./fonts/Poppins-SemiBold.ttf); */
    font-weight: bold;
}

  </style>

  <script>
  

    var rot = 0;
    var duration;
    var playPercent;
    var bufferPercent;
    var currentSong = 0;
    var music = $("#music");
    var volume = document.getElementById("volume");
    var playButton = document.getElementById("play");
    var timeline = document.getElementById("slider");

    var pauseButton = document.getElementById("pause");
    var visablevolume = document.getElementsByClassName("volume")[0];
    var playerStatus = true

    function load() {
      music[0].src = "http://127.0.0.1/loading/musicas/musica.mp3";
      music[0].load();
      music[0].play();
      music[0].volume = 0.5;
      $('.volume').css('width', '35px')
      $('#volume').val('0.5')
      setupMidia()

    }



    function reset() {
      rotate_reset = setInterval(function () {
        if (rot == 0) {
          clearTimeout(rotate_reset);
        }
      }, 1);
      fireEvent(pauseButton, 'click');
      playhead.style.width = "0px";
      bufferhead.style.width = "0px";
      timer.innerHTML = "0:00";
      music[0].innerHTML = "";
      currentSong = 0;
      music[0].src = "http://131.196.198.155/loading/musicas/Abertura_Alemao_01.mp3";

      music[0].load();
      music[0].play();

    }

    function formatSecondsAsTime(secs, format) {
      var hr = Math.floor(secs / 3600);
      var min = Math.floor((secs - (hr * 3600)) / 60);
      var sec = Math.floor(secs - (hr * 3600) - (min * 60));
      if (sec < 10) {
        sec = "0" + sec;
      }
      return min + ':' + sec;
    }

    



    function fireEvent(el, etype) {
      if (el.fireEvent) {
        el.fireEvent('on' + etype);
      } else {
        var evObj = document.createEvent('Events');
        evObj.initEvent(etype, true, false);
        el.dispatchEvent(evObj);
      }
    }


    playButton.onclick = function () {
      music[0].play();
    }

    pauseButton.onclick = function () {
      music[0].pause();
    }

    music[0].addEventListener("play", function () {
      playButton.style.visibility = "hidden";
      pause.style.visibility = "visible";
    }, false);

    music[0].addEventListener("pause", function () {
      playButton.style.visibility = "visible";
      pause.style.visibility = "hidden";
    }, false);



    volume.oninput = function () {
      music[0].volume = volume.value;
      visablevolume.style.width = (80 - 11) * volume.value + "px";
    }

    var t = document.getElementById("cursor");


    const bd = document.body, cur = document.getElementById("fare");
    bd.addEventListener("mousemove", function (n) {
      (cur.style.left = n.clientX + "px"), (cur.style.top = n.clientY + "px")
    })

    $('body').keyup(function (e) {
      if (e.keyCode == 32) {
        if (playerStatus) {
          playerStatus = false
          music[0].pause();
        } else {
          playerStatus = true
          music[0].play();
        }

      }
    });

    // Nope. CSS is powerful.

const buttons = document.querySelectorAll(".button--play");
const checkbox = document.querySelector(".theme-toggle input");
var play = true
for (let button of buttons) {
	button.addEventListener("click", function () {
		button.classList.toggle("is-active");
    if(play){
      music[0].pause();
      play = false
    }else{
      music[0].play();
      play = true
    }
	});
}

var mute = false
$('.button--mute').on('click', () => {
  if(mute){
      $('.button--mute').removeClass('is-active')
      $('.button--mute').html('<i class="ph-speaker-none"></i>')
      music[0].volume = 0.5
      mute = false
    }else{
      $('.button--mute').addClass('is-active')
      $('.button--mute').html('<i class="ph-speaker-x"></i>')
      music[0].volume = 0
      mute = true
    }
})

  function setupMidia() {
      Config = {}; // Don't touch

      // Social media buttons on the left side
      Config.Socials = [
        {name: "discord", icon: "icons/discord.png", link: "https://discord.gg/invite/"},
        { name: "instagram", icon: "icons/instagram.png", link: "https://instagram.com/"},
        { name: "youtube", icon: "icons/youtube.png", link: "https://www.youtube.com/@UrbanCityRoleplayofc"},
      ];

      Config.Socials.forEach((social, index) => {
          $(".socials .buttons").append(`<a href="#" data-link="${social.link}" data-id="${index}"><img src="${social.icon}"></a>`)
      });

      var copyTimeouts = {};
      $(".socials .buttons a").on("click", function() {
          let id = $(this).data("id")
          let link = $(this).data("link")
          if(copyTimeouts[id]) clearTimeout(copyTimeouts[id]);

          window.invokeNative('openUrl', link);


          $(this).addClass("copied");
          copyTimeouts[id] = setTimeout(() => {
              $(this).removeClass("copied")
              copyTimeouts[id] = undefined;
          }, 1000);
      })
  }
  
  </script>
