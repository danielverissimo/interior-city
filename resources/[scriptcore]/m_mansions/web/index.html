<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Catálogo de Mobílias</title>
</head>
<body>
  <main id="app" class="hidden">
    <section class="furniture-panel">
      <header class="furniture-header">
        <div class="furniture-head-side">
          <button id="edit" class="furniture-btn furniture-btn-ghost">EDITAR MOBÍLIAS</button>
        </div>

        <div class="furniture-title-wrap">
          <div class="furniture-title-ornament" aria-hidden="true"></div>
          <h1>CATÁLOGO DE MOBÍLIAS</h1>
          <span id="mansion"></span>
        </div>

        <div class="furniture-head-side furniture-head-side-right">
          <button id="settings" class="furniture-btn furniture-icon hidden" title="Configurar valores">⚙</button>
          <button id="close" class="furniture-btn furniture-icon" title="Fechar">×</button>
        </div>
      </header>

      <div class="furniture-toolbar">
        <input id="search" placeholder="Buscar mobília ou prop..." autocomplete="off">
        <select id="category"><option value="">Todas as categorias</option></select>
        <div class="furniture-count" id="count"></div>
      </div>

      <div id="grid" class="furniture-grid"></div>
    </section>

    <section id="configModal" class="furniture-modal hidden">
      <div class="furniture-modal-card">
        <div class="furniture-modal-head">
          <div>
            <h2>CONFIGURAR VALORES</h2>
            <p>Edite os preços do catálogo. As alterações são globais.</p>
          </div>
          <button id="configClose" class="furniture-btn furniture-icon">×</button>
        </div>

        <div class="furniture-config-tools">
          <input id="configSearch" placeholder="Buscar mobília..." autocomplete="off">
          <input id="bulkPrice" type="number" min="0" step="1" value="500" placeholder="Valor para todas">
          <button id="setAll" class="furniture-btn furniture-btn-ghost">APLICAR EM TODAS</button>
          <button id="savePrices" class="furniture-btn furniture-btn-primary">SALVAR ALTERAÇÕES</button>
        </div>

        <div id="priceList" class="furniture-price-list"></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
