<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>mg_animacoes by IgorWinchester Toca do Mago FiveM</title>
</head>
<body>
    <div id="app">
        <div id="box" v-if="show">
            <header id="text_top">Painel de animações<br></header>
            <button id="close_btn" @click="close()">X</button>
            <div id="box_middle">
                <div id="boxes" v-for="k in table" @click="confirm_an(k.nome)"><div id="text_box">{{ k.nome }}</div></div>
            </div>
            <header id="text_bottom">Para cancelar a animação pressione F6</header>
        </div>
    </div>
</body>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js" integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo="  crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script type="text/javascript" src="script.js"></script>
</html>
