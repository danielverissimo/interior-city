name: interior-city-tocado

services:
  db:
    image: mariadb:10.11.19
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: vrp
      MARIADB_USER: vrp
      MARIADB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_root_password
      - db_app_password
    volumes:
      - db_data:/var/lib/mysql
      - ${INTERIOR_CITY_RELEASE_PATH:-.}/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - backend
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  fxserver:
    build:
      context: ${INTERIOR_CITY_RELEASE_PATH:-.}/docker/fxserver
    image: interior-city/fxserver-tocado:35245
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TXHOST_DATA_PATH: /txData
      TXHOST_GAME_NAME: fivem
      TXHOST_TXA_PORT: "40120"
      TXHOST_INTERFACE: 0.0.0.0
      TXHOST_FXS_PORT: "30120"
      TXHOST_MAX_SLOTS: "7"
      PLAYIT_PUBLIC_ENDPOINT: ${PLAYIT_PUBLIC_ENDPOINT:-}
      PLAYIT_HTTPS_HOST: ${PLAYIT_HTTPS_HOST:-}
      FIVEM_LISTING_ENABLED: ${FIVEM_LISTING_ENABLED:-false}
    ports:
      - 127.0.0.1:${INTERIOR_CITY_TXADMIN_PORT:-40120}:40120/tcp
    secrets:
      - cfx_license
      - db_app_password
      - steam_web_api
      - webhook_logs
      - webhook_bugs
    volumes:
      - ${INTERIOR_CITY_RELEASE_PATH:-.}:/server-data
      - ./state/txData:/txData
      - ./state/cache:/server-data/cache
    tmpfs:
      - /server-data/runtime:uid=1000,gid=1000,mode=0700
      - /tmp:uid=1000,gid=1000,mode=1777
    networks:
      - backend
      - egress
    mem_limit: 8g
    cpus: "4.0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/40120"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 12

  playit:
    profiles: [public]
    build:
      context: ${INTERIOR_CITY_RELEASE_PATH:-.}/docker/playit
    image: interior-city/playit:1.0.10
    restart: unless-stopped
    depends_on:
      - fxserver
    network_mode: service:fxserver
    secrets:
      - playit_agent_key
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "sh", "-c", "test -S /tmp/playit-agent.sock"]
      start_period: 15s
      interval: 10s
      timeout: 3s
      retries: 6

  connect_proxy:
    profiles: [listing]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      - fxserver
    network_mode: service:fxserver
    environment:
      CADDY_DOMAIN: ${PLAYIT_HTTPS_HOST:-}
    volumes:
      - ${INTERIOR_CITY_RELEASE_PATH:-.}/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"

  backup:
    image: mariadb:10.11.19
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/usr/local/bin/interior-city-backup"]
    command: ["loop"]
    secrets:
      - db_root_password
    volumes:
      - ${INTERIOR_CITY_RELEASE_PATH:-.}/docker/backup/backup.sh:/usr/local/bin/interior-city-backup:ro
      - ./backups:/backups
      - ./state/txData:/txData:ro
    tmpfs:
      - /tmp:mode=0700
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: "0.5"

networks:
  backend:
    internal: true
  egress:

volumes:
  db_data:
  caddy_data:

secrets:
  db_root_password:
    file: ./secrets/db_root_password
  db_app_password:
    file: ./secrets/db_app_password
  cfx_license:
    file: ./secrets/cfx_license
  steam_web_api:
    file: ./secrets/steam_web_api
  webhook_logs:
    file: ./secrets/webhook_logs
  webhook_bugs:
    file: ./secrets/webhook_bugs
  playit_agent_key:
    file: ./secrets/playit_agent_key
